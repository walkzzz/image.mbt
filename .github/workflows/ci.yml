name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (fmt / check / mbti / docs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: moon update

      - name: Moon version
        run: moon version

      - name: Format check
        run: moon fmt --check

      - name: Check compilation (4 targets, deny warnings)
        run: |
          moon check --deny-warn --target native
          moon check --deny-warn --target wasm-gc
          moon check --deny-warn --target js
          moon check --deny-warn --target wasm

      - name: API contract (mbti drift must not pass)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Docs consistency gate
        run: |
          node scripts/check_docs.mjs --self-test
          node scripts/check_docs.mjs
          node scripts/gen_api_index.mjs --check
          node scripts/check_version.mjs
          node scripts/check_pkg_imports.mjs
          node scripts/sync_pages.mjs --check

      - name: Pages gate (build playground js + semantic checks)
        run: node scripts/check_pages.mjs

      - name: Benchmark corpus gate (golden 20 + malformed 6)
        run: |
          moon build --release cmd/imgtool
          node scripts/check_benchmarks.mjs

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, js, wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: moon update

      - name: Run tests (${{ matrix.target }})
        run: moon test --target ${{ matrix.target }}

  bench:
    name: Benchmark (native)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: moon update

      - name: Run benchmarks
        run: moon bench --target native

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: moon update

      - name: Generate coverage
        run: |
          moon test --enable-coverage --target native
          moon coverage analyze | tee coverage.txt
          moon coverage report -f summary | tee coverage-summary.txt

      - name: Enforce coverage threshold
        run: node scripts/check_coverage.mjs coverage-summary.txt --min 90

      - name: Summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep '^Total:' coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-native
          path: |
            coverage.txt
            coverage-summary.txt

  mutation:
    name: Mutation gate (7 packages, 12 mutants)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: moon update

      - name: Run mutation tests
        run: node scripts/mutation_test.mjs --min-kill=80

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report.json

  prove:
    name: Formal proof (Why3 + Z3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install provers
        run: |
          sudo apt-get update
          sudo apt-get install -y why3 z3

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: moon update

      - name: Run moon prove
        run: |
          why3 --version
          z3 --version
          cd image.core
          moon prove

  bindings:
    name: Language bindings (npm wasm + Dart)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update registry index
        run: moon update

      - name: Build imgtool (release)
        run: moon build --release cmd/imgtool

      - name: Run Dart binding self-test
        run: node scripts/check_dart_binding.mjs --no-build

      - name: Build npm wasm artifact (npm/image.wasm 是构建产物，不入库)
        run: node scripts/build_npm_wasm.mjs --no-test

      - name: Run npm wasm self-test
        run: node npm/test.mjs
